services:
  backend:
    build: .
    container_name: alumni_backend
    restart: always
    ports:
      - "80:80"
      - "3000:3000"
    environment:
      - PORT=80
      - NODE_ENV=development
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=alumni_user
      - DB_PASSWORD=alumni_password
      - DB_NAME=alumni_portal
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: alumni_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: alumni_portal
      MYSQL_USER: alumni_user
      MYSQL_PASSWORD: alumni_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
